table:
  name: workflow_triggers
  schema: public

object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id

insert_permissions:
  - role: user
    permission:
      check:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
      columns:
        - workflow_id
        - type
        - config
        - enabled
    comment: ""

select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - type
        - config
        - enabled
        - created_at
        - updated_at
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
    comment: ""

update_permissions:
  - role: user
    permission:
      columns:
        - type
        - config
        - enabled
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
      check: null
    comment: ""

delete_permissions:
  - role: user
    permission:
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
    comment: ""
