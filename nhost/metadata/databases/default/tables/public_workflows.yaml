table:
  name: workflows
  schema: public

object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id

  - name: user
    using:
      foreign_key_constraint_on: created_by

array_relationships:
  - name: workflow_runs
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_runs
          schema: public

  - name: workflow_steps
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_steps
          schema: public

  - name: workflow_triggers
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_triggers
          schema: public

insert_permissions:
  - role: user
    permission:
      check:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      set:
        created_by: X-Hasura-User-Id
      columns:
        - org_id
        - name
        - description

select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - name
        - description
        - created_by
        - created_at
        - updated_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id

update_permissions:
  - role: user
    permission:
      columns:
        - name
        - description
      filter:
        created_by:
          _eq: X-Hasura-User-Id
      check:
        created_by:
          _eq: X-Hasura-User-Id

delete_permissions:
  - role: user
    permission:
      filter:
        created_by:
          _eq: X-Hasura-User-Id

query_root_fields:
  - select

subscription_root_fields:
  - select
