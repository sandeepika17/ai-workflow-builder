table:
  name: workflows
  schema: public

object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id

  - name: user
    using:
      foreign_key_constraint_on: created_by

array_relationships:
  - name: workflow_runs
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_runs
          schema: public

  - name: workflow_steps
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_steps
          schema: public

  - name: workflow_triggers
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_triggers
          schema: public

select_permissions:
  - role: public
    permission:
      columns:
        - id
        - name
        - description
        - org_id
        - created_by
        - created_at
        - updated_at
      filter: {}
    comment: ""

insert_permissions:
  - role: public
    permission:
      columns:
        - id
        - name
        - description
        - org_id
        - created_by
        - created_at
        - updated_at
      check: {}
    comment: ""

update_permissions:
  - role: public
    permission:
      columns:
        - name
        - description
        - org_id
        - created_by
        - updated_at
      filter: {}
      check: {}
    comment: ""

delete_permissions:
  - role: public
    permission:
      filter: {}
    comment: ""
