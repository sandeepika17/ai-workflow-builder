table:
  name: org_members
  schema: public

object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id

  - name: user
    using:
      foreign_key_constraint_on: user_id

select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - user_id
        - role
        - created_at
        - updated_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
    comment: ""

insert_permissions:
  - role: user
    permission:
      columns:
        - org_id
        - user_id
        - role
      check:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _eq: owner
    comment: ""

update_permissions:
  - role: user
    permission:
      columns:
        - role
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _eq: owner
      check:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _eq: owner
    comment: ""

delete_permissions:
  - role: user
    permission:
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _eq: owner
    comment: ""
